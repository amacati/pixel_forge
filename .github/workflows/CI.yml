name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  # Run the Python test suite on Linux. The X11 backend needs a real display, a window manager, an
  # open window, and a monitor. We provide those with Xvfb + openbox + xclock before invoking pytest.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps openbox x11-xserver-utils
      - name: Build and install the extension
        run: pip install '.[test]'
      - name: Run tests against a headless X server
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 +extension RANDR +extension COMPOSITE &
          sleep 2
          openbox &
          sleep 1
          xclock &
          sleep 1
          pytest -v

  # Run the Python test suite on Windows.
  # The Windows Graphics Capture backend needs a real desktop with at least one window
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the extension
        shell: bash
        run: pip install '.[test]'
      - name: Run tests
        shell: bash
        run: pytest -v
